<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">An open envelope with a short message and a reply tab</title><rect width="960" height="640" fill="#161122"/><path d="M0 160H960M0 480H960M160 0V640M800 0V640" stroke="#241B32"/><text x="64" y="70" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#C1B0D4">THE REVENUE INBOX</text><text x="64" y="586" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#C1B0D4">TEMPLATES / MAKE THE NEXT LINE COUNT</text><rect x="190" y="156" width="580" height="300" rx="18" fill="#271D35" stroke="#49375F"/><path d="M191 176L480 362 769 176M191 438L381 309M769 438L579 309" fill="none" stroke="#8A40EA" stroke-width="4"/><rect x="306" y="126" width="348" height="174" rx="18" fill="#21182E" stroke="#49375F"/><text x="340" y="174" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#F7F5FA">A reason to write.</text><path d="M340 202L610 202" fill="none" stroke="#806596" stroke-width="3" stroke-linecap="round"/><path d="M340 225L570 225" fill="none" stroke="#806596" stroke-width="3" stroke-linecap="round"/><path d="M340 248L530 248" fill="none" stroke="#806596" stroke-width="3" stroke-linecap="round"/><rect x="603" y="387" width="166" height="68" rx="34" fill="#8A40EA" stroke="#8A40EA"/><text x="641" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#F7F5FA">Reply →</text></svg>